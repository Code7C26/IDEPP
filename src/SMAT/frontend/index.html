<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7931e" />
    <!-- Letra de los títulos (Montserrat), como la caja y el manual. Local, para que ande sin internet -->
    <link rel="stylesheet" href="/fuentes/montserrat.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Ícono al instalar en el iPhone (el resto de los íconos los declara el manifest de la PWA) -->
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <title>DROID-E3D by IDEPP · Seguridad que recorre la planta</title>
    <meta name="description" content="DROID-E3D es un robot que recorre la fábrica, detecta con IA a quien trabaja sin su equipo de protección, avisa al instante y da la alarma en la zona." />
    <!-- Vista previa al compartir el enlace (WhatsApp, LinkedIn) -->
    <meta property="og:title" content="DROID-E3D by IDEPP · Seguridad que recorre la planta" />
    <meta property="og:description" content="Robot con IA que controla el uso del equipo de protección en la fábrica y da la alarma en el momento." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/capturas/panel-claro.webp" />
    <script>
      // Aplica el tema guardado ANTES de dibujar la página, para que no "parpadee" en blanco.
      try {
        const guardado = localStorage.getItem('tema')
        const oscuro = guardado ? guardado === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (oscuro) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
